name: Build Xbox 360 Plugin

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile Code to Plugin
        run: |
          echo "جاري تجميع كود البلجن..."
          cl /EHsc main.cpp /Fe:plugin.xex /LD
          mkdir build_output
          if exist plugin.xex move plugin.xex build_output/
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbox-plugin
          path: build_output/
