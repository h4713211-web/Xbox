name: Build Xbox 360 Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Dummy Plugin
        run: |
          mkdir -p build_output
          echo "XBOX360_PLUGIN_DATA" > build_output/plugin.xex

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xbox-plugin
          path: build_output/
